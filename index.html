// ============ DB LAYER ============
const DB={
  async loadEmps(){const{data}=await supabase.from("employees").select("*").order("id");return data||[]},
  async loadAccts(){const{data}=await supabase.from("accounts").select("*");return data||[]},
  async loadLeaves(){const{data}=await supabase.from("leaves").select("*");return data||[]},
  async loadDais(){const{data}=await supabase.from("dais").select("*").order("id");return(data||[]).map(d=>d.name)},
  async loadPenalties(){const{data}=await supabase.from("penalties").select("*").order("date");return data||[]},

  async upsertEmp(e){
    const row={id:e.id,name:e.name,emp_code:e.empCode,phone:e.phone||"",role:e.role,dai:e.dai,shift:e.shift,status:e.status,join_date:e.joinDate,nationality:e.nationality||"Việt Nam",transfer_date:e.transferDate||""};
    await supabase.from("employees").upsert(row,{onConflict:"id"});
  },
  async deleteEmp(id){await supabase.from("employees").delete().eq("id",id)},

  async addAcct(a){await supabase.from("accounts").insert({username:a.username,password:a.password,emp_id:a.empId})},
  async deleteAcct(empId){await supabase.from("accounts").delete().eq("emp_id",empId)},
  async resetPw(uname){await supabase.from("accounts").update({password:"123456"}).eq("username",uname)},

  async addLeave(l){await supabase.from("leaves").insert({emp_id:l.empId,date:l.date,reason:l.reason,added_by:l.addedBy})},
  async deleteLeave(empId,date){await supabase.from("leaves").delete().eq("emp_id",empId).eq("date",date)},

  async addPenalty(p){await supabase.from("penalties").insert({emp_id:p.empId,date:p.date,kpi_deduction:p.kpi,reason:p.reason,added_by:p.addedBy})},
  async deletePenalty(id){await supabase.from("penalties").delete().eq("id",id)},

  async addDai(name){await supabase.from("dais").insert({name})},
  async deleteDai(name){await supabase.from("dais").delete().eq("name",name)},

  async nextEmpId(){const{data}=await supabase.from("employees").select("id").order("id",{ascending:false}).limit(1);if(!data||!data.length)return"E001";const num=parseInt(data[0].id.slice(1))||0;return`E${String(num+1).padStart(3,"0")}`},

  async getSetting(key){try{const{data}=await supabase.from("settings").select("value").eq("key",key).single();return data?.value||""}catch{return""}},
  async setSetting(key,value){await supabase.from("settings").upsert({key,value},{onConflict:"key"})},

  async autoSwapShifts(){
    const curMonth=getVNMonthKey();
    const lastSwap=await this.getSetting("last_swap_month");
    if(lastSwap===curMonth)return false;
    if(!lastSwap){await this.setSetting("last_swap_month",curMonth);return false}
    const{data:emps}=await supabase.from("employees").select("id,shift").in("shift",[1,2]);
    if(emps&&emps.length){
      for(const e of emps){
        await supabase.from("employees").update({shift:e.shift===1?2:1}).eq("id",e.id);
      }
    }
    await this.setSetting("last_swap_month",curMonth);
    return true;
  },

// Custom date input dd/mm/yyyy — value is yyyy-mm-dd internally
function DateInp({label,value,onChange,...p}){
  const toDisplay=(v)=>{if(!v)return"";const pp=v.split("-");if(pp.length!==3)return v;return`${pp[2]}/${pp[1]}/${pp[0]}`};
  const toISO=(v)=>{if(!v)return"";const pp=v.split("/");if(pp.length!==3)return"";return`${pp[2]}-${pp[1]}-${pp[0]}`};
  const[txt,sTxt]=useState(toDisplay(value));
  useEffect(()=>{sTxt(toDisplay(value))},[value]);
  const handleChange=(e)=>{
    let raw=e.target.value.replace(/[^0-9/]/g,"");
    // Auto-add slashes
    const digits=raw.replace(/\//g,"");
    if(digits.length<=2)raw=digits;
    else if(digits.length<=4)raw=digits.slice(0,2)+"/"+digits.slice(2);
    else raw=digits.slice(0,2)+"/"+digits.slice(2,4)+"/"+digits.slice(4,8);
    sTxt(raw);
    if(raw.length===10){const iso=toISO(raw);if(iso&&!isNaN(Date.parse(iso)))onChange({target:{value:iso}})}
  };
  return<div style={{marginBottom:11}}>
    {label&&<label style={{display:"block",fontSize:10,color:Cl.mu,marginBottom:3,fontWeight:600}}>{label}</label>}
    <input value={txt}onChange={handleChange}placeholder="dd/mm/yyyy"maxLength={10}{...p}style={{width:"100%",padding:"8px 12px",borderRadius:8,border:`1px solid ${Cl.bdr}`,background:Cl.bg,color:Cl.tx,fontSize:12,fontFamily:FM,outline:"none",boxSizing:"border-box",...(p.style||{})}}onFocus={e=>e.target.style.borderColor=Cl.ac}onBlur={e=>{e.target.style.borderColor=Cl.bdr;if(txt.length===10){const iso=toISO(txt);if(iso&&!isNaN(Date.parse(iso)))onChange({target:{value:iso}})}}}/>
  </div>
}

// ============ SALARY / PAYROLL ============
function SalaryP({emps,leaves,pens,cur,dais,salCfg,onSaveCfg}){
  const t=useT();const lg=useContext(LC);const mg=canMg(cur.role);const isA=cur.role==="admin";
  const isStaff=cur.role==="staff";
  const[month,sM]=useState(td().slice(0,7));
  const[y,m]=month.split("-").map(Number);
  const dim=new Date(y,m,0).getDate();
  const[cfg,sCfg]=useState(salCfg||{});
  const[saving,sSaving]=useState(false);
  const[showDetail,sShowDetail]=useState(null);
  useEffect(()=>{sCfg(salCfg||{})},[salCfg]);

  // ===== MONTHLY SETTINGS (tỷ giá, ngày lễ, % thưởng lễ) =====
  const mKey=`monthly_${month}`;
  const msCfg=cfg._monthly||{};
  const ms=msCfg[month]||{rate:26880,holidays:0,holidayPct:100};
  const setMs=(field,val)=>{
    const n={...cfg};if(!n._monthly)n._monthly={};
    if(!n._monthly[month])n._monthly[month]={rate:26880,holidays:0,holidayPct:100};
    n._monthly[month][field]=Number(val)||0;sCfg(n);
  };

  // ===== NATIONALITY CONFIG =====
  // basePre, basePost: lương chưa/đã CC
  // perKpi: trừ/điểm KPI, kpiBonus: thưởng KPI (sau CC), attendBonus: thưởng CC (sau CC)
  const cfgFields=[
    {k:"basePre",l:"Lương thử việc",w:110},
    {k:"basePost",l:"Lương sau CC",w:110},
    {k:"increment",l:"Tăng/3 tháng",w:90},
    {k:"perKpi",l:"Trừ/KPI",w:80},
    {k:"kpiBonus",l:"Thưởng KPI",w:85},
    {k:"attendBonus",l:"Thưởng CC",w:85}
  ];
  const handleCfg=(nat,field,val)=>{const n={...cfg};if(!n[nat])n[nat]={};n[nat][field]=Number(val)||0;sCfg(n)};
  const saveCfg=async()=>{sSaving(true);await onSaveCfg(cfg);sSaving(false);alert(t.salSaved)};
  const fmtN=(n)=>{if(!n&&n!==0)return"0";return Math.round(Number(n)).toLocaleString("vi-VN")};
  const fmtU=(n)=>{const r=ms.rate||26880;if(!r||!n)return"0";return(Math.round(n/r)).toLocaleString("vi-VN")};

  // ===== SALARY CALCULATION =====
  // Auto salary increase: every 3 months after CC, base increases by increment
  // Month of CC = month 0, then month 3 = +1 increment, month 6 = +2, etc.
  const calcSalary=(emp)=>{
    const nat=emp.nationality||"Khác";
    const c=cfg[nat];
    if(!c||(!c.basePre&&!c.basePost))return{configured:false};

    const basePre=c.basePre||0;const basePostOrig=c.basePost||0;
    const increment=c.increment||0;
    const transferDate=emp.transferDate||"";
    let daysPre=dim, daysPost=0, isConfirmed=false;
    let monthsSinceCC=-1, quarters=0, seniorityRaise=0, actualBasePost=basePostOrig;

    if(transferDate){
      const td2=new Date(transferDate);
      const monthStart=new Date(y,m-1,1);
      const monthEnd=new Date(y,m,0);
      monthsSinceCC=(y-td2.getFullYear())*12+((m-1)-td2.getMonth());

      if(td2<=monthStart){
        daysPre=0;daysPost=dim;isConfirmed=true;
        quarters=Math.max(0,Math.floor(monthsSinceCC/3));
        seniorityRaise=quarters*increment;
        actualBasePost=basePostOrig+seniorityRaise;
      }else if(td2>monthEnd){
        daysPre=dim;daysPost=0;isConfirmed=false;monthsSinceCC=-1;
      }else{
        const cd=td2.getDate();daysPre=cd-1;daysPost=dim-daysPre;isConfirmed=true;
        monthsSinceCC=0;quarters=0;seniorityRaise=0;actualBasePost=basePostOrig;
      }
    }

    const baseCalc=Math.round((daysPre/dim)*basePre+(daysPost/dim)*actualBasePost);
    const dailyRate=Math.round(baseCalc/dim);

    const empLeaves=leaves.filter(l=>l.empId===emp.id&&l.date.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date));
    const totalOff=empLeaves.length;
    const ALLOWED_OFF=4;
    const unpaidLeaves=empLeaves.filter(l=>l.reason==="Nghỉ không lương");

    let consecutivePenaltyDays=0;
    const sortedDates=empLeaves.map(l=>{const p=l.date.split("-");return new Date(+p[0],+p[1]-1,+p[2])});
    for(let i=1;i<sortedDates.length;i++){
      const diff=(sortedDates[i]-sortedDates[i-1])/(1000*60*60*24);
      if(diff===1)consecutivePenaltyDays+=3;
    }

    const unpaidPenaltyDays=unpaidLeaves.length*2;
    const unusedOffDays=Math.max(0,ALLOWED_OFF-totalOff);
    const noOffBonus=Math.round(unusedOffDays*dailyRate*1.5);
    const leaveDeduct=Math.round((unpaidPenaltyDays+consecutivePenaltyDays)*dailyRate);

    const kpiTotal=pens.filter(p=>p.empId===emp.id&&p.date&&p.date.startsWith(month)).reduce((s,p)=>s+(p.kpi||0),0);
    const deductKpi=kpiTotal*(c.perKpi||0);

    const kpiBonus=daysPost>0?Math.round((daysPost/dim)*(c.kpiBonus||0)):0;
    const attendBonus=daysPost>0?Math.round((daysPost/dim)*(c.attendBonus||0)):0;
    const holidayBonus=Math.round((ms.holidays||0)*dailyRate*(ms.holidayPct||0)/100);

    const net=Math.max(0,baseCalc+noOffBonus+kpiBonus+attendBonus+holidayBonus-leaveDeduct-deductKpi);
    const usdt=ms.rate?Math.round(net/ms.rate):0;

    return{configured:true,basePre,basePost:actualBasePost,origBasePost:basePostOrig,daysPre,daysPost,baseCalc,dailyRate,isConfirmed,
      monthsSinceCC,quarters,seniorityRaise,increment,
      totalOff,unusedOffDays,noOffBonus,
      unpaidCount:unpaidLeaves.length,unpaidPenaltyDays,consecutivePenaltyDays,leaveDeduct,
      kpiTotal,deductKpi,kpiBonus,attendBonus,holidayBonus,
      net,usdt,empLeaves};
  };

  const staffList=isStaff?emps.filter(e=>e.id===cur.id):emps.filter(e=>e.role==="staff"&&(isA||e.role!=="admin")&&e.status==="active");

  // Export
  const exportPayroll=()=>{
    const rows=staffList.map(e=>{const s=calcSalary(e);if(!s.configured)return null;return{
      "Mã NV":e.empCode,"Tên":e.name,"Đài":e.dai,"Quốc tịch":e.nationality||"",
      "CC":s.isConfirmed?"Đã CC":"Chưa CC","Thâm niên CC":s.monthsSinceCC>=0?`${s.monthsSinceCC} tháng`:"—",
      "Tăng lương":s.seniorityRaise,"Lương CB hiện tại":s.basePost,
      "Lương CB tính":s.baseCalc,"Lương/ngày":s.dailyRate,
      "Ngày nghỉ":s.totalOff,"Không nghỉ x1.5":s.noOffBonus,
      "Trừ nghỉ":s.leaveDeduct,
      "KPI trừ":s.kpiTotal,"Trừ KPI":s.deductKpi,
      "Thưởng KPI":s.kpiBonus,"Thưởng CC":s.attendBonus,"Thưởng lễ":s.holidayBonus,
      "Thực nhận (VNĐ)":s.net,"USDT":s.usdt
    }}).filter(Boolean);
    const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Bảng lương");XLSX.writeFile(wb,`NOHU_Luong_${month}.xlsx`);
  };

  return<div className="fade-in">
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}>
      <div><h2 style={{margin:0,fontSize:18,fontWeight:800,color:Cl.tx}}>💰 {t.salT}</h2><p style={{margin:"3px 0 0",color:Cl.mu,fontSize:11}}>{t.salS} — {dim} ngày</p></div>
      <div style={{display:"flex",gap:6,alignItems:"center"}}>
        <MonthNav value={month} onChange={sM}/>
        {mg&&<Btn v="warn" onClick={exportPayroll}>{t.salExport}</Btn>}
      </div>
    </div>

    {/* Monthly settings bar */}
    {isA&&<div style={{display:"flex",gap:12,marginBottom:14,padding:"12px 16px",background:Cl.card,borderRadius:10,border:`1px solid ${Cl.bdr}`,alignItems:"center",flexWrap:"wrap"}}>
      <div style={{fontSize:10,color:Cl.mu,fontWeight:700}}>⚙️ Tháng {m}/{y}</div>
      <div style={{display:"flex",alignItems:"center",gap:4}}>
        <label style={{fontSize:10,color:Cl.mu}}>Tỷ giá (VNĐ/USDT):</label>
        <input type="number"value={ms.rate||""}onChange={e=>setMs("rate",e.target.value)}style={{width:90,padding:"4px 8px",borderRadius:6,border:`1px solid ${Cl.bdr}`,background:Cl.bg,color:"#f59e0b",fontSize:11,fontFamily:FM,outline:"none",textAlign:"right",fontWeight:700}}/>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:4}}>
        <label style={{fontSize:10,color:Cl.mu}}>Số ngày lễ:</label>
        <input type="number"value={ms.holidays||""}onChange={e=>setMs("holidays",e.target.value)}style={{width:50,padding:"4px 8px",borderRadius:6,border:`1px solid ${Cl.bdr}`,background:Cl.bg,color:Cl.tx,fontSize:11,fontFamily:FM,outline:"none",textAlign:"right"}}/>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:4}}>
        <label style={{fontSize:10,color:Cl.mu}}>Thưởng lễ (%):</label>
        <input type="number"value={ms.holidayPct||""}onChange={e=>setMs("holidayPct",e.target.value)}style={{width:55,padding:"4px 8px",borderRadius:6,border:`1px solid ${Cl.bdr}`,background:Cl.bg,color:Cl.tx,fontSize:11,fontFamily:FM,outline:"none",textAlign:"right"}}/>
      </div>
      <Btn v="success" sm onClick={saveCfg} disabled={saving}>{saving?"...":"💾 Lưu"}</Btn>
    </div>}

    {/* CSKH personal card */}
    {isStaff&&staffList.length>0&&(()=>{const me=staffList[0];const s=calcSalary(me);
    if(!s.configured)return<div style={{padding:16,background:Cl.card,borderRadius:12,border:`1px solid ${Cl.bdr}`,color:Cl.wr,fontSize:12,marginBottom:14}}>{t.salNoConfig}</div>;

          <div style={{fontSize:8,color:Cl.mu,marginTop:3}}>

// ============ EMPLOYEE FORM ============
function EmpF({emp,curRole,dais,onSave,onCancel}){
  const t=useT();const lg=useContext(LC);const isE=!!emp;
  const shOpts=Object.entries(SH).map(([k,v])=>({v:Number(k),l:`${v.icon} ${v.label[lg]}`}));
  const[f,sF]=useState(emp||{name:"",empCode:"",phone:"",role:"staff",dai:dais[0]||"NOHU",shift:1,status:"active",joinDate:td(),nationality:"Việt Nam",transferDate:"",username:"",acctPassword:"123456"});

  const s=(k,v)=>{
    const nf={...f,[k]:v};
    if(k==="role"&&v!=="staff"){nf.dai="—";nf.shift=0}
    if(k==="role"&&v==="staff"&&nf.dai==="—"){nf.dai=dais[0]||"NOHU";if(!nf.shift)nf.shift=1}
    sF(nf);
  };

  const rO=curRole==="admin"?Object.entries(ROLES).filter(([k])=>k!=="admin").map(([k])=>({v:k,l:`${ROLES[k].icon} ${rl(k,lg)}`})):[{v:"staff",l:`👤 ${rl("staff",lg)}`}];
  const isStaff=f.role==="staff";

  return<div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
      <Inp label={t.fName}value={f.name}onChange={e=>s("name",e.target.value)}/>
      <Inp label={t.fCode}value={f.empCode}onChange={e=>s("empCode",e.target.value.toUpperCase())}style={{fontFamily:FM,fontWeight:700}}/>
    </div>
    <div style={{display:"grid",gridTemplateColumns:isStaff?"1fr 1fr 1fr 1fr":"1fr 1fr",gap:8}}>
      <Sel label={t.fLv}value={f.role}onChange={e=>s("role",e.target.value)}options={rO}/>
      {isStaff&&<Sel label={t.fDai}value={f.dai}onChange={e=>s("dai",e.target.value)}options={dais.length?dais:["NOHU"]}/>}
      {isStaff&&<Sel label={t.fShift}value={f.shift}onChange={e=>s("shift",Number(e.target.value))}options={shOpts}/>}
      <Sel label={t.fNat}value={f.nationality}onChange={e=>s("nationality",e.target.value)}options={NATS}/>
    </div>
    <div style={{display:"grid",gridTemplateColumns:isE?"1fr 1fr 1fr":"1fr 1fr",gap:8}}>
      <DateInp label={t.fJoin}value={f.joinDate}onChange={e=>s("joinDate",e.target.value)}/>
      <DateInp label={t.fTrans}value={f.transferDate||""}onChange={e=>s("transferDate",e.target.value)}/>
      {isE&&<Sel label={t.fSt}value={f.status}onChange={e=>s("status",e.target.value)}options={[{v:"active",l:t.stA},{v:"inactive",l:t.stI}]}/>}
    </div>
    {!isE&&<div style={{padding:"12px 14px",borderRadius:10,background:`${Cl.ac}08`,border:`1px solid ${Cl.ac}18`,marginBottom:11}}>
      <div style={{fontSize:10,color:Cl.ac,fontWeight:700,marginBottom:6}}>🔑 Tài khoản đăng nhập</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        <Inp label={t.fUser}value={f.username||""}onChange={e=>s("username",e.target.value)}placeholder="VD: JAX"style={{fontFamily:FM}}/>
        <Inp label={t.fPass}value={f.acctPassword||"123456"}onChange={e=>s("acctPassword",e.target.value)}placeholder="VD: 123"style={{fontFamily:FM}}/>
      </div>
    </div>}
    <div style={{display:"flex",gap:6,justifyContent:"flex-end",marginTop:14}}>
      <Btn v="ghost"onClick={onCancel}>{t.cancel}</Btn>
      <Btn v="success"onClick={()=>{
        if(!f.name||!f.empCode){alert("Nhập tên và mã NV!");return}
        if(isStaff&&!f.dai){alert("Chọn đài!");return}
        if(!isE&&!f.username){alert("Nhập username!");return}
        onSave({...f,dai:isStaff?f.dai:"—",shift:isStaff?f.shift:0});
      }}>{isE?t.save:t.create}</Btn>
    </div>
  </div>;
}

          <button onClick={()=>{setUser(null);sPage("dashboard")}}style={{marginTop:6,width:"100%",padding:"5px 0",borderRadius:6,border:`1px solid ${Cl.bdr}`,background:"transparent",color:Cl.no,fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:Fo,transition:"all .15s"}}onMouseEnter={e=>e.currentTarget.style.background=`${Cl.no}10`}onMouseLeave={e=>e.currentTarget.style.background="transparent"}>{col?"🚪":t.logout}</button>
        </div>
        <div style={{padding:4,borderTop:`1px solid ${Cl.bdr}`,textAlign:"center"}}><button onClick={()=>sCol(!col)}style={{background:"none",border:"none",color:Cl.mu,cursor:"pointer",fontSize:11}}>{col?"▶":"◀"}</button></div>
      </div>

      {/* Main Content */}
      <div style={{flex:1,overflow:"auto",display:"flex",flexDirection:"column"}}>
        {/* Top bar */}
        <div style={{padding:"10px 20px",borderBottom:`1px solid ${Cl.bdr}`,display:"flex",justifyContent:"space-between",alignItems:"center",background:Cl.sf,flexShrink:0}}>
          <div style={{fontSize:10,color:Cl.mu}}>🏠 / <span style={{color:Cl.tx,fontWeight:600}}>{menu.find(m=>m.key===page)?.label}</span></div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <LangSw lang={lang}setLang={setLangPersist}/>
            <DBdg dai={cur.dai}/><SBdg shift={cur.shift}/>
            <span style={{fontSize:10,color:Cl.mu}}>{fmt(td())}</span>
          </div>
        </div>

        {/* Swap notification */}
        {swapped&&<div style={{margin:"12px 20px 0",padding:"10px 14px",borderRadius:8,background:`${Cl.wr}12`,border:`1px solid ${Cl.wr}30`,color:Cl.wr,fontSize:11,fontWeight:600,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span>{t.shiftSwapped}</span>
          <button onClick={()=>setSw(false)}style={{background:"none",border:"none",color:Cl.wr,cursor:"pointer",fontSize:14}}>✕</button>
        </div>}

        {/* Page content */}
        <div style={{padding:20,flex:1,overflow:"auto"}}>
          {page==="dashboard"&&<DashP emps={emps}leaves={leaves}cur={cur}dais={dais}/>}
          {page==="employees"&&<EmpP emps={emps}cur={cur}dais={dais}onEdit={e=>sEM(e)}onAdd={()=>sAM(true)}onDel={delEmp}/>}
          {page==="leaves"&&<LeaveP emps={emps}leaves={leaves}pens={pens}cur={cur}onAdd={addLv}onDel={delLv}onAddPen={addPen}onDelPen={delPen}/>}
          {page==="salary"&&<SalaryP emps={emps}leaves={leaves}pens={pens}cur={cur}dais={dais}salCfg={salCfg}onSaveCfg={saveSalCfg}/>}
          {page==="perms"&&<PermP cur={cur}/>}
          {page==="accounts"&&canMg(cur.role)&&<AcctP accts={accts}emps={emps}cur={cur}onReset={resetPw}/>}
          {page==="dais"&&isA&&<DaiP dais={dais}emps={emps}onAdd={addDai}onDel={delDai}/>}
        </div>
      </div>

      {/* Employee Form Modal */}
      <Mod open={!!editM||addM}onClose={()=>{sEM(null);sAM(false)}}title={editM?t.editEmp:t.addEmpT}wide>
        <EmpF emp={editM}curRole={cur.role}dais={dais}onSave={saveEmp}onCancel={()=>{sEM(null);sAM(false)}}/>
      </Mod>
    </div>
  </LC.Provider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
