const DB={
  async loadEmps(){const{data}=await supabase.from("employees").select("*").order("id");return data||[]},
  async loadAccts(){const{data}=await supabase.from("accounts").select("*");return data||[]},
  async loadLeaves(){const{data}=await supabase.from("leaves").select("*");return data||[]},
  async loadDais(){const{data}=await supabase.from("dais").select("*").order("id");return(data||[]).map(d=>d.name)},

  async upsertEmp(e){const row={id:e.id,name:e.name,emp_code:e.empCode,phone:e.phone||"",role:e.role,dai:e.dai,shift:e.shift,status:e.status,join_date:e.joinDate,nationality:e.nationality||"Việt Nam"};await supabase.from("employees").upsert(row,{onConflict:"id"})},
  async deleteEmp(id){await supabase.from("employees").delete().eq("id",id)},

  async addAcct(a){await supabase.from("accounts").insert({username:a.username,password:a.password,emp_id:a.empId})},
  async deleteAcct(empId){await supabase.from("accounts").delete().eq("emp_id",empId)},
  async resetPw(uname){await supabase.from("accounts").update({password:"123456"}).eq("username",uname)},

  async addLeave(l){await supabase.from("leaves").insert({emp_id:l.empId,date:l.date,reason:l.reason,added_by:l.addedBy})},
  async deleteLeave(empId,date){await supabase.from("leaves").delete().eq("emp_id",empId).eq("date",date)},

  async addDai(name){await supabase.from("dais").insert({name})},
  async deleteDai(name){await supabase.from("dais").delete().eq("name",name)},

  async nextEmpId(){const{data}=await supabase.from("employees").select("id").order("id",{ascending:false}).limit(1);if(!data||!data.length)return"E001";const num=parseInt(data[0].id.slice(1))||0;return`E${String(num+1).padStart(3,"0")}`},

  // Convert DB row → app format
  toEmp(r){return{id:r.id,name:r.name,empCode:r.emp_code,phone:r.phone,role:r.role,dai:r.dai,shift:r.shift,status:r.status,joinDate:r.join_date,nationality:r.nationality}},
  toAcct(r){return{username:r.username,password:r.password,empId:r.emp_id}},
  toLv(r){return{empId:r.emp_id,date:r.date,reason:r.reason,addedBy:r.added_by}},
};

function AcctP({accts,emps,cur,onReset}){const t=useT();const isA=cur.role==="admin";const v=accts.filter(a=>{const e=emps.find(x=>x.id===a.empId);return e&&(isA||e.role!=="admin")});
return<div><h2 style={{margin:"0 0 4px",fontSize:18,fontWeight:800,color:Cl.tx}}>{t.acctT}</h2><p style={{margin:"0 0 14px",color:Cl.mu,fontSize:11}}>{t.acctS}</p>
<div style={{background:Cl.card,borderRadius:12,border:`1px solid ${Cl.bdr}`,overflow:"hidden"}}><table style={{width:"100%",borderCollapse:"collapse",fontFamily:Fo}}><thead><tr style={{borderBottom:`1px solid ${Cl.bdr}`}}>{[t.acctU,t.acctP,t.acctE,t.acctR,""].map((h,i)=><th key={i}style={{padding:"9px 12px",textAlign:"left",fontSize:9,fontWeight:700,color:Cl.mu,textTransform:"uppercase"}}>{h}</th>)}</tr></thead>
<tbody>{v.map(a=>{const e=emps.find(x=>x.id===a.empId);return<tr key={a.username}style={{borderBottom:`1px solid ${Cl.bdr}06`}}><td style={{padding:"8px 12px",fontFamily:FM,fontSize:11,color:Cl.acL,fontWeight:600}}>{a.username}</td><td style={{padding:"8px 12px",fontFamily:FM,fontSize:11,color:Cl.mu}}>{"•".repeat(a.password.length)}</td><td style={{padding:"8px 12px"}}>{e&&<div style={{display:"flex",alignItems:"center",gap:5}}><Av name={e.name}role={e.role}size={22}/><span style={{fontSize:10,color:Cl.tx}}>{e.name}</span></div>}</td><td style={{padding:"8px 12px"}}>{e&&<Bdg role={e.role}/>}</td><td style={{padding:"8px 12px"}}><Btn v="warn"sm onClick={()=>onReset(a.username)}>{t.resetP}</Btn></td></tr>})}</tbody></table></div></div>}

// --- Emp Form ---
function EmpF({emp,curRole,dais,onSave,onCancel}){const t=useT();const lg=useContext(LC);const isE=!!emp;
const[f,sF]=useState(emp||{name:"",empCode:"",phone:"",role:"staff",dai:dais[0]||"NOHU",shift:1,status:"active",joinDate:td(),nationality:"Việt Nam",username:"",acctPassword:"123456"});
const s=(k,v)=>{
  const nf={...f,[k]:v};
  if(k==="role"&&v!=="staff"){nf.dai="—"}
  if(k==="role"&&v==="staff"&&nf.dai==="—"){nf.dai=dais[0]||"NOHU"}
  sF(nf);
};
const rO=curRole==="admin"?Object.entries(ROLES).filter(([k])=>k!=="admin").map(([k])=>({v:k,l:`${ROLES[k].icon} ${rl(k,lg)}`})):[{v:"staff",l:`👤 ${rl("staff",lg)}`}];
const isStaff=f.role==="staff";
return<div>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}><Inp label={t.fName}value={f.name}onChange={e=>s("name",e.target.value)}/><Inp label={t.fCode}value={f.empCode}onChange={e=>s("empCode",e.target.value.toUpperCase())}style={{fontFamily:FM,fontWeight:700}}/></div>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
<Sel label={t.fLv}value={f.role}onChange={e=>s("role",e.target.value)}options={rO}/>
{isStaff&&<Sel label={t.fDai}value={f.dai}onChange={e=>s("dai",e.target.value)}options={dais.length?dais:["NOHU"]}/>}
<Sel label={t.fShift}value={f.shift}onChange={e=>s("shift",Number(e.target.value))}options={[{v:1,l:`🌅 ${t.s1L}`},{v:2,l:`🌙 ${t.s2L}`}]}/>
{!isStaff&&<div/>}
</div>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}><Inp label={t.fJoin}type="date"value={f.joinDate}onChange={e=>s("joinDate",e.target.value)}/><Sel label={t.fNat}value={f.nationality}onChange={e=>s("nationality",e.target.value)}options={NATS}/></div>
{!isE&&<div style={{padding:"12px 14px",borderRadius:10,background:`${Cl.ac}08`,border:`1px solid ${Cl.ac}18`,marginBottom:11}}><div style={{fontSize:10,color:Cl.ac,fontWeight:700,marginBottom:6}}>🔑 Tài khoản đăng nhập</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}><Inp label={t.acctU}value={f.username||""}onChange={e=>s("username",e.target.value)}placeholder="VD: JAX"style={{fontFamily:FM}}/><Inp label={t.acctP}value={f.acctPassword||"123456"}onChange={e=>s("acctPassword",e.target.value)}placeholder="VD: 123"style={{fontFamily:FM}}/></div></div>}
{isE&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}><Inp label={t.fPhone}value={f.phone||""}onChange={e=>s("phone",e.target.value)}/><Sel label={t.fSt}value={f.status}onChange={e=>s("status",e.target.value)}options={[{v:"active",l:t.stA},{v:"inactive",l:t.stI}]}/></div>}
<div style={{display:"flex",gap:6,justifyContent:"flex-end",marginTop:14}}><Btn v="ghost"onClick={onCancel}>{t.cancel}</Btn><Btn v="success"onClick={()=>{if(f.name&&f.empCode&&(isStaff?f.dai:true))onSave({...f,dai:isStaff?f.dai:"—"})}}>{isE?t.save:t.create}</Btn></div>
</div>}

// ============ MAIN APP ============
function App(){
  const[lang,setLang]=useState("vi");
  const[loading,sL]=useState(true);const[err,sErr]=useState("");
  const[user,sUser]=useState(null);
  const[emps,sEmps]=useState([]);const[accts,sAccts]=useState([]);
  const[leaves,sLvs]=useState([]);const[dais,sDais]=useState([]);
  const[page,sPage]=useState("dashboard");
  const[editM,sEM]=useState(null);const[addM,sAM]=useState(false);const[col,sCol]=useState(false);

  const reload=async()=>{
    try{
      const[eR,aR,lR,dR]=await Promise.all([DB.loadEmps(),DB.loadAccts(),DB.loadLeaves(),DB.loadDais()]);
      sEmps((eR||[]).map(DB.toEmp));sAccts((aR||[]).map(DB.toAcct));sLvs((lR||[]).map(DB.toLv));sDais(dR&&dR.length?dR:["NOHU","GO99","TT88","MMOO","789P","UY88"]);sL(false);
    }catch(e){sErr("Không kết nối được Supabase. Kiểm tra lại URL và Key!");sL(false);console.error(e)}
  };
  useEffect(()=>{reload()},[]);

  const cur=user?emps.find(e=>e.id===user.empId):null;
  const isA=cur?.role==="admin";const t=L[lang];

  const saveEmp=async emp=>{
    try{
    if(emp.id){await DB.upsertEmp(emp)}
    else{const nid=await DB.nextEmpId();const ne={...emp,id:nid};await DB.upsertEmp(ne);await DB.addAcct({username:emp.username||emp.empCode.toLowerCase(),password:emp.acctPassword||"123456",empId:nid})}
    sEM(null);sAM(false);await reload();
    }catch(e){console.error(e);alert("Lỗi: "+e.message)}
  };
  const delEmp=async emp=>{if(!confirm(t.delCfm))return;await DB.deleteAcct(emp.id);await DB.deleteEmp(emp.id);await reload()};
  const togSh=async emp=>{await DB.upsertEmp({...emp,shift:emp.shift===1?2:1});await reload()};
  const addLv=async lv=>{if(leaves.find(l=>l.empId===lv.empId&&l.date===lv.date)){alert(t.alrOff);return}await DB.addLeave(lv);await reload()};
  const delLv=async lv=>{await DB.deleteLeave(lv.empId,lv.date);await reload()};
  const addDai=async n=>{if(dais.includes(n)){alert(t.daiEx);return}await DB.addDai(n);await reload()};
  const delDai=async n=>{await DB.deleteDai(n);await reload()};
  const resetPw=async u=>{await DB.resetPw(u);alert(t.resetD);await reload()};

  if(loading)return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:Cl.bg,fontFamily:Fo,color:Cl.mu}}><div style={{textAlign:"center"}}><div style={{fontSize:32,fontWeight:900,color:"#f59e0b",fontFamily:FM,marginBottom:8}}>N</div><div>{t.loading}</div></div></div>;

  if(err)return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:Cl.bg,fontFamily:Fo,padding:20}}><div style={{background:Cl.sf,borderRadius:16,padding:32,maxWidth:500,textAlign:"center",border:`1px solid ${Cl.no}30`}}><div style={{fontSize:40,marginBottom:12}}>⚠️</div><div style={{color:Cl.no,fontSize:14,fontWeight:700,marginBottom:8}}>Lỗi kết nối</div><div style={{color:Cl.mu,fontSize:12,lineHeight:1.6,marginBottom:16}}>{err}</div><div style={{color:Cl.mu,fontSize:11,background:Cl.bg,padding:12,borderRadius:8,fontFamily:FM,textAlign:"left"}}>1. Mở file index.html<br/>2. Thay YOUR_SUPABASE_URL<br/>3. Thay YOUR_SUPABASE_ANON_KEY</div></div></div>;

  if(!user)return<LC.Provider value={lang}><div style={{position:"relative"}}><div style={{position:"absolute",top:16,right:16,zIndex:10}}><LangSw lang={lang}setLang={setLang}/></div><LoginP onLogin={a=>{sUser(a);sPage("dashboard")}}accts={accts}emps={emps}/></div></LC.Provider>;

  const menu=[{key:"dashboard",icon:"📊",label:t.dashboard},{key:"employees",icon:"👥",label:t.employees},{key:"leaves",icon:"🏖️",label:t.leaves},...(canMg(cur.role)?[{key:"accounts",icon:"🔑",label:t.acctMg}]:[]),...(isA?[{key:"perms",icon:"🔐",label:t.perms},{key:"dais",icon:"🎰",label:t.daiMg}]:[])];

  return<LC.Provider value={lang}><div style={{display:"flex",height:"100vh",background:Cl.bg,fontFamily:Fo,color:Cl.tx}}>
    <div style={{width:col?56:190,transition:"width .25s",background:Cl.sf,borderRight:`1px solid ${Cl.bdr}`,display:"flex",flexDirection:"column",flexShrink:0,overflow:"hidden"}}>
      <div style={{padding:col?"14px 8px":"14px 14px",borderBottom:`1px solid ${Cl.bdr}`,display:"flex",alignItems:"center",gap:8}}><div style={{width:28,height:28,borderRadius:7,flexShrink:0,background:"linear-gradient(135deg,#f59e0b,#ef4444)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:900,color:"#fff",fontFamily:FM}}>N</div>{!col&&<div><div style={{fontSize:13,fontWeight:900,color:Cl.tx}}>NOHU</div><div style={{fontSize:8,color:Cl.mu,fontWeight:600}}>{t.appSub}</div></div>}</div>
      <div style={{padding:"8px 5px",flex:1}}>{menu.map(item=>{const act=page===item.key;return<div key={item.key}onClick={()=>sPage(item.key)}style={{display:"flex",alignItems:"center",gap:7,padding:col?"8px 0":"8px 10px",justifyContent:col?"center":"flex-start",borderRadius:7,marginBottom:1,cursor:"pointer",background:act?`${Cl.ac}15`:"transparent",color:act?Cl.acL:Cl.mu,fontWeight:act?600:500,fontSize:11}}onMouseEnter={e=>{if(!act)e.currentTarget.style.background=Cl.card}}onMouseLeave={e=>{if(!act)e.currentTarget.style.background="transparent"}}><span style={{fontSize:13}}>{item.icon}</span>{!col&&item.label}</div>})}</div>
      <div style={{padding:col?"10px 5px":"10px 10px",borderTop:`1px solid ${Cl.bdr}`}}><div style={{display:"flex",alignItems:"center",gap:6,justifyContent:col?"center":"flex-start"}}><Av name={cur.name}role={cur.role}size={26}/>{!col&&<div style={{flex:1,minWidth:0}}><div style={{fontSize:10,fontWeight:600,color:Cl.tx,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{cur.name}</div><Bdg role={cur.role}/></div>}</div>
      <button onClick={()=>sUser(null)}style={{marginTop:6,width:"100%",padding:"5px 0",borderRadius:6,border:`1px solid ${Cl.bdr}`,background:"transparent",color:Cl.no,fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:Fo}}>{col?"🚪":t.logout}</button></div>
      <div style={{padding:4,borderTop:`1px solid ${Cl.bdr}`,textAlign:"center"}}><button onClick={()=>sCol(!col)}style={{background:"none",border:"none",color:Cl.mu,cursor:"pointer",fontSize:11}}>{col?"▶":"◀"}</button></div>
    </div>
    <div style={{flex:1,overflow:"auto",display:"flex",flexDirection:"column"}}>
      <div style={{padding:"10px 20px",borderBottom:`1px solid ${Cl.bdr}`,display:"flex",justifyContent:"space-between",alignItems:"center",background:Cl.sf,flexShrink:0}}>
        <div style={{fontSize:10,color:Cl.mu}}>🏠 / <span style={{color:Cl.tx,fontWeight:600}}>{menu.find(m=>m.key===page)?.label}</span></div>
        <div style={{display:"flex",alignItems:"center",gap:8}}><LangSw lang={lang}setLang={setLang}/><DBdg dai={cur.dai}/><SBdg shift={cur.shift}/><span style={{fontSize:10,color:Cl.mu}}>{fmt(td())}</span></div>
      </div>
      <div style={{padding:20,flex:1,overflow:"auto"}}>
        {page==="dashboard"&&<DashP emps={emps}leaves={leaves}cur={cur}dais={dais}/>}
        {page==="employees"&&<EmpP emps={emps}cur={cur}dais={dais}onEdit={e=>sEM(e)}onAdd={()=>sAM(true)}onShift={togSh}onDel={delEmp}/>}
        {page==="leaves"&&<LeaveP emps={emps}leaves={leaves}cur={cur}onAdd={addLv}onDel={delLv}/>}
        {page==="perms"&&<PermP cur={cur}/>}
        {page==="accounts"&&canMg(cur.role)&&<AcctP accts={accts}emps={emps}cur={cur}onReset={resetPw}/>}
        {page==="dais"&&isA&&<DaiP dais={dais}emps={emps}onAdd={addDai}onDel={delDai}/>}
      </div>
    </div>
    <Mod open={!!editM||addM}onClose={()=>{sEM(null);sAM(false)}}title={editM?t.editEmp:t.addEmpT}wide>
      <EmpF emp={editM}curRole={cur.role}dais={dais}onSave={saveEmp}onCancel={()=>{sEM(null);sAM(false)}}/>
    </Mod>
  </div></LC.Provider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
